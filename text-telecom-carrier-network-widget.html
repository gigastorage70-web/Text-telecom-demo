<style>
.fm-hero-visual,.fm-hero-visual *{box-sizing:border-box;}
.fm-hero-visual{position:relative;width:100%;max-width:100%;height:520px;font-family:'Plus Jakarta Sans',sans-serif;}
.fm-map-frame{position:absolute;inset:0;border:1px solid #E7E9E8;border-radius:20px;background:linear-gradient(160deg,#FFFFFF 0%,#F1F7F3 100%);overflow:hidden;box-shadow:0 30px 60px -34px rgba(20,23,26,.16);}
.fm-map-caption{position:absolute;top:16px;left:20px;z-index:3;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:#6B706E;text-transform:uppercase;}
.fm-map-svg{width:100%;height:100%;display:block;}
.fm-basedot{fill:#D3E7D8;}
.fm-route{fill:none;stroke:url(#fmRouteGrad);stroke-width:1.1;opacity:.32;transition:opacity .25s ease, stroke-width .25s ease;}
.fm-route.fm-active{opacity:1;stroke-width:1.8;}
.fm-route.fm-dim{opacity:.12;}
.fm-packet{fill:#2A9D45;}
.fm-node{cursor:pointer;outline:none;}
.fm-node-halo{fill:url(#fmNodeGlow);opacity:.45;transition:opacity .25s ease;}
.fm-node-dot{fill:#3DDC5C;stroke:#FFFFFF;stroke-width:1.4;transition:r .2s ease, fill .2s ease;}
.fm-node-hub .fm-node-dot{fill:#2A9D45;}
.fm-node.fm-active .fm-node-dot{fill:#2A9D45;}
.fm-node.fm-dim .fm-node-halo{opacity:.15;}
.fm-node.fm-dim .fm-node-dot{opacity:.35;}
.fm-pulse-ring{fill:none;stroke:#2A9D45;stroke-width:1;opacity:0;animation:fmradar 3.2s ease-out infinite;}
.fm-pulse-ring.r2{animation-delay:1.05s;}
.fm-pulse-ring.r3{animation-delay:2.1s;}
@keyframes fmradar{0%{opacity:.5;transform:scale(.4);transform-origin:center;}100%{opacity:0;transform:scale(2.4);transform-origin:center;}}
.fm-tooltip{position:absolute;z-index:5;background:#FFFFFF;border:1px solid #E7E9E8;border-radius:10px;padding:10px 14px;pointer-events:none;opacity:0;transform:translate(-50%,calc(-100% - 14px)) scale(.96);transition:opacity .16s ease, transform .16s ease;box-shadow:0 16px 32px -14px rgba(20,23,26,.2);white-space:nowrap;}
.fm-tooltip.fm-show{opacity:1;transform:translate(-50%,calc(-100% - 20px)) scale(1);}
.fm-tt-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#14171A;}
.fm-tt-tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:#2A9D45;letter-spacing:.04em;margin-top:2px;}
.fm-tt-meta{font-size:11.5px;color:#4A4F54;margin-top:3px;}
.fm-stat-card{position:absolute;background:rgba(255,255,255,.92);border:1px solid #E7E9E8;border-radius:12px;padding:14px 16px;backdrop-filter:blur(10px);box-shadow:0 20px 40px -20px rgba(20,23,26,.14);}
.fm-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;display:block;line-height:1.1;color:#14171A;}
.fm-num--accent2{color:#2A9D45;}
.fm-lbl{font-size:11px;color:#6B706E;font-weight:500;letter-spacing:.02em;}
.fm-stat--countries{top:8%;left:6%;}
.fm-stat--uptime{top:8%;right:6%;}
.fm-stat--live{bottom:8%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 18px;}
.fm-stat--live .fm-num{font-family:'JetBrains Mono',monospace;font-size:19px;color:#2A9D45;font-weight:600;}
.fm-live-dot{width:7px;height:7px;border-radius:50%;background:#3DDC5C;box-shadow:0 0 0 3px rgba(61,220,92,.25);flex:none;animation:fmlivedot 1.4s ease-in-out infinite;}
@keyframes fmlivedot{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (max-width:1024px){.fm-hero-visual{height:440px;}}
@media (max-width:767px){
  .fm-hero-visual{height:380px;}
  .fm-map-frame{border-radius:16px;}
  .fm-stat-card{padding:10px 12px;border-radius:10px;}
  .fm-num{font-size:15px;}
  .fm-lbl{font-size:10px;}
  .fm-stat--countries{top:6%;left:5%;}
  .fm-stat--uptime{top:6%;right:5%;}
  .fm-stat--live{bottom:6%;padding:10px 14px;gap:10px;}
  .fm-map-caption{display:none;}
  .fm-tooltip{display:none;}
}
@media (max-width:480px){
  .fm-hero-visual{height:300px;}
  .fm-stat-card{padding:8px 10px;border-radius:9px;}
  .fm-num{font-size:12.5px;}
  .fm-lbl{font-size:8.5px;letter-spacing:0;}
  .fm-stat--live .fm-num{font-size:13px;}
  .fm-stat--live{gap:8px;padding:8px 11px;}
}
</style>
<script>
(function(){
  var root = document.currentScript ? document.currentScript.previousElementSibling : null;
  var scope = document.querySelector('.fm-hero-visual');
  if(!scope) return;
  var svg = scope.querySelector('.fm-map-svg');
  var frame = scope.querySelector('.fm-map-frame');
  var tooltip = scope.querySelector('#fmTooltip');
  var ttName = scope.querySelector('#fmTtName');
  var ttTag = scope.querySelector('#fmTtTag');
  var ttMeta = scope.querySelector('#fmTtMeta');
  var nodes = scope.querySelectorAll('.fm-node');
  var routes = scope.querySelectorAll('.fm-route');

  function activate(node){
    var city = node.getAttribute('data-city');
    nodes.forEach(function(n){ n.classList.toggle('fm-dim', n !== node); n.classList.remove('fm-active'); });
    node.classList.add('fm-active');
    routes.forEach(function(r){
      var match = r.getAttribute('data-city') === city;
      r.classList.toggle('fm-active', match);
      r.classList.toggle('fm-dim', !match);
    });
    ttName.textContent = city;
    ttTag.textContent = node.getAttribute('data-tag');
    ttMeta.textContent = node.getAttribute('data-meta');

    var pt = svg.createSVGPoint();
    pt.x = parseFloat(node.getAttribute('data-x'));
    pt.y = parseFloat(node.getAttribute('data-y'));
    var ctm = svg.getScreenCTM();
    if(ctm){
      var screenPt = pt.matrixTransform(ctm);
      var frameRect = frame.getBoundingClientRect();
      tooltip.style.left = (screenPt.x - frameRect.left) + 'px';
      tooltip.style.top = (screenPt.y - frameRect.top) + 'px';
    }
    tooltip.classList.add('fm-show');
  }
  function reset(){
    nodes.forEach(function(n){ n.classList.remove('fm-active','fm-dim'); });
    routes.forEach(function(r){ r.classList.remove('fm-active','fm-dim'); });
    tooltip.classList.remove('fm-show');
  }
  nodes.forEach(function(node){
    node.addEventListener('pointerenter', function(){ activate(node); });
    node.addEventListener('pointerleave', function(){ reset(); });
    node.addEventListener('focus', function(){ activate(node); });
    node.addEventListener('blur', function(){ reset(); });
    node.addEventListener('click', function(e){
      e.stopPropagation();
      if(node.classList.contains('fm-active')){ reset(); } else { activate(node); }
    });
  });
  document.addEventListener('click', reset);

  var el = document.getElementById('fmLiveCounter');
  if(el){
    var base = 12556;
    setInterval(function(){
      base += Math.round((Math.random() - 0.42) * 260);
      base = Math.max(9800, Math.min(15600, base));
      el.textContent = base.toLocaleString('en-US');
    }, 1400);
  }
})();
</script>
